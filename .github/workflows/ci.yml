name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          CONTENT_URL: 'off' # CI must not depend on the live site being up
      # Guardrail: fails the check if a change makes the site worse for guests (accessibility, search basics,
      # layout jumping). Speed only warns, because lab speed numbers move a little from run to run.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14.0 autorun
        env:
          CONTENT_URL: 'off'
